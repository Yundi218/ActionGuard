services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: actionguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d actionguard"]
      interval: 2s
      timeout: 2s
      retries: 20

  fixture-loader:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations/001_commerce.sql:/migrations/001_commerce.sql:ro
      - ../fixtures/commerce.sql:/fixtures/commerce.sql:ro
    command:
      - psql
      - postgres://postgres:postgres@postgres:5432/actionguard?sslmode=disable
      - --single-transaction
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /migrations/001_commerce.sql
      - -f
      - /fixtures/commerce.sql

  commerce-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/commerce-mcp"]
    depends_on:
      policy-import:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/actionguard?sslmode=disable
      MCP_ADDR: :8081
      MCP_URL: http://commerce-mcp:8081/mcp
      MCP_GATEWAY_TOKEN: actionguard-demo-gateway-token
      DEMO_FULL_TOKEN: actionguard-demo-full-token
      DEMO_READ_ONLY_TOKEN: actionguard-demo-read-only-token
      DEMO_USER_999_TOKEN: actionguard-demo-user-999-token
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 20

  policy-import:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/policy-import"]
    depends_on:
      fixture-loader:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/actionguard?sslmode=disable
      MCP_URL: http://commerce-mcp:8081/mcp
      MCP_GATEWAY_TOKEN: actionguard-demo-gateway-token
      DEMO_FULL_TOKEN: actionguard-demo-full-token
      DEMO_READ_ONLY_TOKEN: actionguard-demo-read-only-token
      DEMO_USER_999_TOKEN: actionguard-demo-user-999-token
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/api"]
    depends_on:
      commerce-mcp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/actionguard?sslmode=disable
      API_ADDR: :8080
      MCP_URL: http://commerce-mcp:8081/mcp
      MCP_GATEWAY_TOKEN: actionguard-demo-gateway-token
      DEMO_FULL_TOKEN: actionguard-demo-full-token
      DEMO_READ_ONLY_TOKEN: actionguard-demo-read-only-token
      DEMO_USER_999_TOKEN: actionguard-demo-user-999-token
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
    ports:
      - "8080:8080"
