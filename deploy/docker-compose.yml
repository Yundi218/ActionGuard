services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: actionguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d actionguard"]
      interval: 2s
      timeout: 2s
      retries: 20

  fixture-loader:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations/001_commerce.sql:/migrations/001_commerce.sql:ro
      - ../fixtures/commerce.sql:/fixtures/commerce.sql:ro
    command:
      - psql
      - postgres://postgres:postgres@postgres:5432/actionguard?sslmode=disable
      - --single-transaction
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /migrations/001_commerce.sql
      - -f
      - /fixtures/commerce.sql

  commerce-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      fixture-loader:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/actionguard?sslmode=disable
      MCP_ADDR: :8081
      MCP_GATEWAY_TOKEN: local-dev-gateway-token
    ports:
      - "8081:8081"
