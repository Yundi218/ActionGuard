services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: actionguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d actionguard"]
      interval: 2s
      timeout: 2s
      retries: 20
